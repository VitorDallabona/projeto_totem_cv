{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Biométrico - Terminal de Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh; /* Permite rolar se a tela for hiper pequena */
        }
        .camera-container {
            width: 100%;
            /* Limita o tamanho máximo da câmera para sobrar espaço pro texto */
            max-height: 70vh; 
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.15);
            border: 3px solid #27ae60;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .camera-container img {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            /* contain garante que o vídeo inteiro apareça sem dar zoom cortando as bordas */
            object-fit: contain; 
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-between py-4 px-3">

    <div class="text-center mb-3">
        <h1 class="display-4 fw-bold text-success mb-2">Controle de Acesso Biométrico</h1>
        <p class="text-secondary fs-5">Posicione seu rosto em frente à câmera para registrar presença</p>
    </div>

    <div class="container-fluid flex-grow-1 d-flex flex-column justify-content-center">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="camera-container">
                    <img src="{% url 'video_feed' %}" alt="Feed do Totem" id="totem-feed">
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4 text-secondary">
        <div class="spinner-grow spinner-grow-sm text-success me-2" role="status"></div>
        <small>Sistema de Reconhecimento Facial Ativo e Monitorando</small>
    </div>

</body>
</html>
