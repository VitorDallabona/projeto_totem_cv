
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Monitoramento - Catraca Virtual</title>
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .camera-box {
            margin-top: 20px;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            
            /* Mantém a proporção padrão de webcam (4:3) */
            width: 640px; 
            height: 480px;
            
            margin-left: auto;
            margin-right: auto;
        }
        
        .camera-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .btn-voltar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Monitoramento de Acesso ao Vivo</h2>
        <p>Sistema de IA com Liveness Detection e Catraca Virtual</p>
        
        <div class="camera-box">
            <img 
                src="{% url 'video_feed' %}" 
                alt="Feed da Câmera do Totem"
            >
        </div>
        
        <a 
            href="{% url 'student_absences' %}" 
            class="btn-voltar"
        >
            Voltar ao Painel
        </a>
    </div>
</body>
</html>
