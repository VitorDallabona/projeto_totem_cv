{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body text-center">
                <h3>Alterar Foto</h3>
                <p class="text-muted">Aluno: {{ student.user.get_full_name }}</p>
                
                {% if student.profile_photo %}
                    <img src="{{ student.profile_photo.url }}" class="img-thumbnail mb-3" style="width: 200px;">
                {% endif %}

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="file" name="new_photo" class="form-control" required>
                    </div>
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100">Atualizar Foto</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-link mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
